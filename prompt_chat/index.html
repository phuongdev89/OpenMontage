<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Video Prompt Chat</title>
  <style>
    :root {
      --bg-dark: #121316;
      --bg-sidebar: #18191e;
      --bg-card: #22242a;
      --bg-code: #16171b;
      --border-color: #2e313a;
      --text-main: #eceff4;
      --text-muted: #8b92a2;
      --accent: #d14a28;
      --accent-hover: #b83d1c;
      --accent-soft: rgba(209, 74, 40, 0.15);
      --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--font-sans);
      background-color: var(--bg-dark);
      color: var(--text-main);
      height: 100vh;
      display: flex;
      overflow: hidden;
    }
    #sidebar {
      width: 280px;
      background: var(--bg-sidebar);
      border-right: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
    }
    .sidebar-header {
      padding: 16px;
      border-bottom: 1px solid var(--border-color);
    }
    .app-title {
      font-size: 16px;
      font-weight: 700;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
    }
    .app-title span.badge {
      font-size: 11px;
      background: var(--accent-soft);
      color: var(--accent);
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: 600;
    }
    .btn-new-chat {
      width: 100%;
      padding: 10px;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: background 0.15s;
    }
    .btn-new-chat:hover { background: var(--accent-hover); }
    .conversations-list {
      flex: 1;
      overflow-y: auto;
      padding: 10px 8px;
    }
    .conv-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 12px;
      margin-bottom: 4px;
      border-radius: 6px;
      cursor: pointer;
      color: var(--text-muted);
      transition: all 0.15s;
      font-size: 14px;
    }
    .conv-item:hover {
      background: var(--bg-card);
      color: var(--text-main);
    }
    .conv-item.active {
      background: var(--bg-card);
      color: var(--text-main);
      border-left: 3px solid var(--accent);
      font-weight: 500;
    }
    .conv-title {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex: 1;
      margin-right: 8px;
    }
    .btn-delete-conv {
      background: transparent;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      padding: 4px;
      border-radius: 4px;
      display: none;
    }
    .conv-item:hover .btn-delete-conv { display: block; }
    .btn-delete-conv:hover { color: #ff5c5c; }

    #main {
      flex: 1;
      display: flex;
      flex-direction: column;
      height: 100vh;
      background: var(--bg-dark);
      position: relative;
    }
    .chat-header {
      padding: 14px 20px;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--bg-dark);
    }
    .chat-header h2 {
      font-size: 15px;
      font-weight: 600;
      color: var(--text-main);
    }
    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 24px 20px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    .message {
      max-width: 850px;
      width: 100%;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .message.user {
      align-items: flex-end;
    }
    .message.user .bubble {
      background: #2a2d36;
      color: var(--text-main);
      padding: 12px 16px;
      border-radius: 10px 10px 2px 10px;
      font-size: 14.5px;
      line-height: 1.5;
      max-width: 80%;
      white-space: pre-wrap;
    }
    .message.assistant {
      align-items: stretch;
    }
    .code-block-container {
      background: var(--bg-code);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      overflow: hidden;
    }
    .code-block-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 14px;
      background: rgba(255, 255, 255, 0.03);
      border-bottom: 1px solid var(--border-color);
      font-size: 12px;
      color: var(--text-muted);
    }
    .btn-copy {
      background: rgba(255, 255, 255, 0.08);
      color: var(--text-main);
      border: 1px solid var(--border-color);
      padding: 5px 12px;
      border-radius: 5px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.15s;
    }
    .btn-copy:hover {
      background: var(--accent);
      border-color: var(--accent);
    }
    .btn-copy.copied {
      background: #238636;
      border-color: #238636;
      color: #fff;
    }
    .code-content {
      padding: 16px;
      font-family: var(--font-mono);
      font-size: 14px;
      line-height: 1.6;
      color: #d1d5db;
      white-space: pre-wrap;
      word-break: break-word;
      user-select: text;
    }

    .chat-input-wrapper {
      padding: 16px 20px 20px;
      border-top: 1px solid var(--border-color);
      background: var(--bg-dark);
    }
    .chat-input-container {
      max-width: 850px;
      margin: 0 auto;
      display: flex;
      gap: 10px;
      background: var(--bg-sidebar);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 10px 14px;
      align-items: flex-end;
    }
    .chat-input-container:focus-within {
      border-color: var(--accent);
    }
    textarea {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text-main);
      font-size: 14px;
      font-family: var(--font-sans);
      resize: none;
      line-height: 1.5;
      max-height: 160px;
      min-height: 24px;
    }
    .btn-send {
      background: var(--accent);
      color: white;
      border: none;
      width: 36px;
      height: 36px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      transition: background 0.15s;
    }
    .btn-send:hover { background: var(--accent-hover); }
    .btn-send:disabled {
      background: var(--border-color);
      color: var(--text-muted);
      cursor: not-allowed;
    }

    .loading-status {
      max-width: 850px;
      margin: 0 auto 12px;
      font-size: 13px;
      color: var(--accent);
      display: none;
      align-items: center;
      gap: 8px;
    }
    .spinner {
      width: 14px;
      height: 14px;
      border: 2px solid rgba(209, 74, 40, 0.3);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .attachments { display:flex; flex-wrap:wrap; gap:8px; max-width:850px; margin:0 auto 10px; }
    .attachment img, .message img { max-width:240px; max-height:180px; object-fit:contain; border-radius:6px; }
    .attachment { display:flex; align-items:center; gap:4px; }
    .attachment button { background:transparent; color:var(--text-main); border:0; cursor:pointer; }
    .downloads { display:flex; flex-wrap:wrap; gap:12px; padding:12px; }
    .downloads a { color:#ffa58e; }
    #main { min-width:0; }
    @media (max-width:600px) { #sidebar { width:130px; } .app-title { font-size:12px; } .chat-messages { padding:12px 8px; } .chat-input-wrapper { padding:10px 8px; } }
  </style>
</head>
<body>

  <aside id="sidebar">
    <div class="sidebar-header">
      <div class="app-title">
        <span>🎬 Video Prompt Studio</span>
        <span class="badge">SSE</span>
      </div>
      <button class="btn-new-chat" id="btnNewChat">
        <span>+</span> Tạo hội thoại mới
      </button>
    </div>
    <div class="conversations-list" id="convList"></div>
  </aside>

  <main id="main">
    <header class="chat-header">
      <h2 id="currentConvTitle">Đang tải...</h2>
    </header>

    <div class="chat-messages" id="messagesContainer"></div>

    <div class="chat-input-wrapper">
      <div class="loading-status" id="loadingStatus">
        <div class="spinner"></div>
        <span>AI đang stream prompt video...</span>
      </div>
      <div class="attachments" id="attachmentPreview"></div>
      <div class="chat-input-container">
        <button class="btn-copy" id="btnAttach" title="Tải ảnh đề bài">＋ Ảnh</button>
        <input type="file" id="imageInput" accept="image/png,image/jpeg,image/webp" multiple hidden>
        <textarea id="promptInput" rows="1" placeholder="Nhập đề hoặc dán ảnh (Ctrl+V). Enter để gửi, Shift+Enter xuống dòng."></textarea>
        <button class="btn-send" id="btnSend" title="Gửi">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="22" y1="2" x2="11" y2="13"></line>
            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
          </svg>
        </button>
      </div>
    </div>
  </main>

  <script>
    let activeConvId = null;
    let conversations = [];
    let pendingImages = [];
    let sending = false;
    const imageInput = document.getElementById('imageInput');
    const btnAttach = document.getElementById('btnAttach');
    const attachmentPreview = document.getElementById('attachmentPreview');
    btnAttach.onclick = () => imageInput.click();
    imageInput.onchange = async () => { await addImages([...imageInput.files]); imageInput.value = ''; };

    const convListEl = document.getElementById('convList');
    const messagesContainer = document.getElementById('messagesContainer');
    const promptInput = document.getElementById('promptInput');
    const btnSend = document.getElementById('btnSend');
    const btnNewChat = document.getElementById('btnNewChat');
    const currentConvTitle = document.getElementById('currentConvTitle');
    const loadingStatus = document.getElementById('loadingStatus');
    promptInput.addEventListener('paste', async event => {
      const items = [...(event.clipboardData?.items || [])];
      const files = items.filter(item => item.type.startsWith('image/')).map(item => item.getAsFile()).filter(Boolean);
      if (files.length) { event.preventDefault(); await addImages(files); }
    });
    async function addImages(files) {
      if (sending) return;
      for (const file of files) {
        if (!['image/png', 'image/jpeg', 'image/webp'].includes(file.type) || file.size > 10 * 1024 * 1024) {
          alert('Chỉ nhận PNG/JPEG/WebP, tối đa 10 MB mỗi ảnh.'); continue;
        }
        if (pendingImages.length >= 8) { alert('Tối đa 8 ảnh mỗi tin nhắn.'); break; }
        const data_url = await new Promise((resolve, reject) => {
          const reader = new FileReader(); reader.onload = () => resolve(reader.result);
          reader.onerror = reject; reader.readAsDataURL(file);
        });
        pendingImages.push({name:file.name || 'clipboard.png', data_url});
      }
      renderAttachments();
    }
    function renderAttachments() {
      attachmentPreview.replaceChildren();
      pendingImages.forEach((image, index) => {
        const item = document.createElement('div'); item.className = 'attachment';
        const img = document.createElement('img'); img.src = image.data_url; img.alt = image.name;
        const remove = document.createElement('button'); remove.textContent = '✕'; remove.title = 'Bỏ ảnh';
        remove.onclick = () => { pendingImages.splice(index, 1); renderAttachments(); };
        item.append(img, remove); attachmentPreview.append(item);
      });
    }

    promptInput.addEventListener('input', () => {
      promptInput.style.height = 'auto';
      promptInput.style.height = Math.min(promptInput.scrollHeight, 160) + 'px';
    });

    promptInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });

    btnSend.addEventListener('click', sendMessage);
    btnNewChat.addEventListener('click', () => createNewConversation());

    async function fetchConversations() {
      try {
        const res = await fetch('/api/conversations');
        conversations = await res.json();
        renderSidebar();
        if (conversations.length > 0 && !activeConvId) {
          selectConversation(conversations[0].id);
        } else if (conversations.length === 0) {
          await createNewConversation();
        }
      } catch (err) {
        console.error('Lỗi tải danh sách hội thoại:', err);
      }
    }

    function renderSidebar() {
      convListEl.innerHTML = '';
      conversations.forEach(c => {
        const item = document.createElement('div');
        item.className = 'conv-item' + (c.id === activeConvId ? ' active' : '');
        item.onclick = (e) => {
          if (!e.target.closest('.btn-delete-conv')) selectConversation(c.id);
        };

        const titleSpan = document.createElement('span');
        titleSpan.className = 'conv-title';
        titleSpan.textContent = c.title || 'Hội thoại';

        const btnDel = document.createElement('button');
        btnDel.className = 'btn-delete-conv';
        btnDel.innerHTML = '✕';
        btnDel.title = 'Xóa';
        btnDel.onclick = (e) => {
          e.stopPropagation();
          deleteConversation(c.id);
        };

        item.appendChild(titleSpan);
        item.appendChild(btnDel);
        convListEl.appendChild(item);
      });
    }

    async function selectConversation(id) {
      if (sending) return;
      activeConvId = id;
      pendingImages = []; renderAttachments();
      renderSidebar();
      try {
        const res = await fetch(`/api/conversations/${id}`);
        const data = await res.json();
        currentConvTitle.textContent = data.conversation.title || 'Hội thoại';
        renderMessages(data.messages);
        if (data.job?.status === 'running') resumeJob(id);
        else if (data.job?.status === 'failed') appendAssistantBlock(`[Lỗi: ${data.job.detail}]`);
      } catch (err) {
        console.error('Lỗi tải hội thoại:', err);
      }
    }

    async function createNewConversation() {
      if (sending) return;
      try {
        const res = await fetch('/api/conversations', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ title: 'Hội thoại mới' })
        });
        const newConv = await res.json();
        activeConvId = newConv.id;
        await fetchConversations();
        selectConversation(newConv.id);
      } catch (err) {
        console.error('Lỗi tạo hội thoại:', err);
      }
    }

    async function deleteConversation(id) {
      if (sending) return;
      if (!confirm('Xóa cuộc hội thoại này?')) return;
      try {
        await fetch(`/api/conversations/${id}`, { method: 'DELETE' });
        if (activeConvId === id) activeConvId = null;
        await fetchConversations();
      } catch (err) {
        console.error('Lỗi xóa hội thoại:', err);
      }
    }

    function renderMessages(messages) {
      messagesContainer.innerHTML = '';
      messages.forEach(m => {
        if (m.role === 'user') {
          appendUserMessage(m.content, m.metadata?.images || []);
        } else {
          const block = appendAssistantBlock(cleanPromptCode(m.content));
          applyMetadata(block, m.metadata || {});
        }
      });
      scrollToBottom();
    }

    function appendUserMessage(text, images = []) {
      const msgEl = document.createElement('div');
      msgEl.className = 'message user';
      const bubble = document.createElement('div');
      bubble.className = 'bubble';
      bubble.textContent = text;
      msgEl.appendChild(bubble);
      images.forEach(image => {
        const img = document.createElement('img'); img.src = image.url || image.data_url;
        img.alt = image.name || 'Ảnh đề bài'; msgEl.appendChild(img);
      });
      messagesContainer.appendChild(msgEl);
    }

    function cleanPromptCode(raw) {
      let code = (raw || '').trim();
      const blocks = [...code.matchAll(/```[^\n]*\n([\s\S]*?)```/g)];
      if (blocks.length && code.endsWith('```')) return blocks.map(block => block[1].trim()).join('\n\n');
      if (code.startsWith('```')) {
        const firstLineEnd = code.indexOf('\n');
        if (firstLineEnd !== -1) {
          code = code.substring(firstLineEnd + 1);
        }
      }
      if (code.endsWith('```')) {
        code = code.substring(0, code.length - 3);
      }
      return code.trim();
    }

    function appendAssistantBlock(initialText = '') {
      const msgEl = document.createElement('div');
      msgEl.className = 'message assistant';

      const container = document.createElement('div');
      container.className = 'code-block-container';

      const header = document.createElement('div');
      header.className = 'code-block-header';
      header.innerHTML = '<span>VIDEO PROMPT</span>';

      const btnCopy = document.createElement('button');
      btnCopy.className = 'btn-copy';
      btnCopy.innerHTML = '📋 Sao chép';

      header.appendChild(btnCopy);

      const codePre = document.createElement('pre');
      codePre.className = 'code-content';
      codePre.textContent = initialText;

      btnCopy.onclick = () => {
        const textToCopy = cleanPromptCode(codePre.textContent);
        navigator.clipboard.writeText(textToCopy).then(() => {
          btnCopy.textContent = '✓ Đã chép!';
          btnCopy.classList.add('copied');
          setTimeout(() => {
            btnCopy.innerHTML = '📋 Sao chép';
            btnCopy.classList.remove('copied');
          }, 2000);
        });
      };

      container.appendChild(header);
      container.appendChild(codePre);
      msgEl.appendChild(container);
      messagesContainer.appendChild(msgEl);

      return { msgEl, codePre, btnCopy, header };
    }
    function applyMetadata(block, metadata) {
      block.header.querySelector('span').textContent = metadata.kind === 'clarification' ? 'CẦN BỔ SUNG THÔNG TIN' : 'VIDEO PROMPT RAW';
      block.btnCopy.hidden = metadata.kind === 'clarification';
      if (metadata.raw_url || metadata.prompts?.length) {
        const downloads = document.createElement('div'); downloads.className = 'downloads';
        const prompts = metadata.prompts || [{file: 'prompt.txt', url: metadata.raw_url}];
        for (const file of [...prompts, ...(metadata.crops || [])]) {
          const link = document.createElement('a'); link.textContent = 'Tải ' + file.file;
          link.href = file.url; link.download = file.file; downloads.append(link);
        }
        block.msgEl.append(downloads);
        (metadata.crops || []).forEach(crop => {
          const img = document.createElement('img'); img.src = crop.url;
          img.alt = crop.description || crop.file; img.title = crop.file; block.msgEl.append(img);
        });
      }
    }

    function scrollToBottom() {
      messagesContainer.scrollTop = messagesContainer.scrollHeight;
    }

    async function resumeJob(convId) {
      if (sending) return;
      sending = true;
      promptInput.disabled = btnSend.disabled = btnAttach.disabled = true;
      loadingStatus.style.display = 'flex';
      try {
        while (activeConvId === convId) {
          const response = await fetch(`/api/conversations/${convId}`);
          if (!response.ok) throw new Error('Không tải được trạng thái hội thoại.');
          const data = await response.json();
          currentConvTitle.textContent = data.conversation.title;
          if (data.job?.status !== 'running') {
            renderMessages(data.messages);
            if (data.job?.status === 'failed') appendAssistantBlock(`[Lỗi: ${data.job.detail}]`);
            await fetchConversations();
            break;
          }
          loadingStatus.querySelector('span').textContent = data.job.detail || 'Yêu cầu đang chạy ngầm…';
          await new Promise(resolve => setTimeout(resolve, 1500));
        }
      } catch (err) {
        appendAssistantBlock(`[Lỗi kết nối: ${err.message}. Tác vụ vẫn chạy trên server; hãy tải lại trang để theo dõi.]`);
      } finally {
        sending = false;
        promptInput.disabled = btnSend.disabled = btnAttach.disabled = false;
        loadingStatus.style.display = 'none';
      }
    }

    async function sendMessage() {
      const content = promptInput.value.trim();
      if ((!content && !pendingImages.length) || !activeConvId || sending) return;
      const convId = activeConvId;
      const images = [...pendingImages];
      sending = true;

      appendUserMessage(content, images);
      pendingImages = []; renderAttachments();
      promptInput.value = '';
      promptInput.style.height = 'auto';

      const block = appendAssistantBlock('');
      const { codePre, btnCopy } = block;
      btnCopy.disabled = true;
      scrollToBottom();

      promptInput.disabled = true;
      btnSend.disabled = true;
      btnAttach.disabled = true;
      loadingStatus.style.display = 'flex';

      try {
        const response = await fetch(`/api/conversations/${convId}/messages`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ content, images })
        });

        if (!response.ok) {
          const err = await response.json();
          codePre.textContent = `[Lỗi: ${err.detail || 'Không thể gửi tin nhắn'}]`;
          return;
        }

        const reader = response.body.getReader();
        const decoder = new TextDecoder('utf-8');
        let buffer = '';
        let streamedRaw = '';

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;

          buffer += decoder.decode(value, { stream: true });
          const lines = buffer.split('\n');
          buffer = lines.pop(); // giữ dòng chưa hoàn chỉnh

          for (const line of lines) {
            const trimmed = line.trim();
            if (!trimmed.startsWith('data: ')) continue;
            const jsonStr = trimmed.slice(6);
            try {
              const parsed = JSON.parse(jsonStr);
              if (parsed.title) {
                currentConvTitle.textContent = parsed.title;
                fetchConversations();
              }
              if (parsed.status) loadingStatus.querySelector('span').textContent = parsed.status;
              if (parsed.chunk) {
                streamedRaw += parsed.chunk;
                codePre.textContent = cleanPromptCode(streamedRaw);
                scrollToBottom();
              }
              if (parsed.error) {
                codePre.textContent += `\n[Lỗi AI: ${parsed.error}]`;
              }
              if (parsed.done) {
                codePre.textContent = cleanPromptCode(parsed.content);
                applyMetadata(block, parsed.metadata || {});
                btnCopy.disabled = false;
                fetchConversations();
              }
            } catch (e) {
              console.error('Lỗi parse SSE:', e);
            }
          }
        }
      } catch (err) {
        codePre.textContent = `[Lỗi kết nối: ${err.message}]`;
      } finally {
        promptInput.disabled = false;
        btnSend.disabled = false;
        btnAttach.disabled = false;
        sending = false;
        loadingStatus.style.display = 'none';
        promptInput.focus();
        await selectConversation(convId);
      }
    }

    fetchConversations();
  </script>
