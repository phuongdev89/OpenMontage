identity:
  name: "Math — Giấy Note"
  visual_concept: "news"
  category: math-video
  mood: clean, editorial, structured
  pace: moderate
  best_for: "Video giải toán phổ thông, đề thi, bài tập algebra/số học"

visual_language:
  color_palette:
    primary: ["#1A1A2E", "#16213E"]
    accent: ["#E94560", "#F5A623"]
    background: "#FDF6E3"        # nền giấy kem
    background_alt: "#FAF0D7"    # giấy note vàng nhạt
    text: "#1A1A2E"
    muted: "#7B7B8F"
    equation_highlight: "#E94560"
    equation_bg: "#FFF8E7"
  composition: "left-anchored title, content flows top-to-bottom, highlight box for key transformation"
  texture: "paper grain subtle, no glossy"

typography:
  headings:
    font: "Merriweather"
    fallback: "Georgia, serif"
    weight: 700
    tracking: "-0.01em"
  body:
    font: "Inter"
    weight: 400
    line_height: 1.7
  equation:
    font: "KaTeX"
    size_multiplier: 1.4
  stat_card:
    font: "Merriweather"
    weight: 800
    size_multiplier: 2.8
  scale_system: "major_third"
  weight_matrix:
    title: 700
    heading: 600
    body: 400
    caption: 400

motion:
  transitions: [fade, slide-up]
  animation_style: "ease-out, editorial, no bounce"
  pacing_rules:
    min_scene_hold_seconds: 3.0
    max_scene_hold_seconds: 15
    text_card_hold_seconds: 4.0
    stat_card_hold_seconds: 3.5
    transition_duration_seconds: 0.35
  entrance: "slide-up từ dưới (0.95 -> 1.0), fade in"
  exit: "fade-out nhẹ"
  equation_reveal: "xuất hiện từng dòng theo lời đọc, highlight biến đổi bằng màu accent"

audio:
  voice_style: "nam, ấm, rõ ràng, nhịp vừa phải — giọng thầy giáo"
  music_mood: "ambient nhẹ, không lấn át lời giảng"
  music_volume: 0.05
  sfx_style: "tiếng lật giấy nhẹ khi chuyển cảnh"
  ducking_threshold_db: -4

asset_generation:
  image_prompt_prefix: "editorial flat illustration, paper texture, warm cream background, Vietnamese math education, "
  image_negative_prompt: "photorealistic, 3d render, dark background, neon, cluttered"
  diagram_style: "clean ink lines, cream background, red accent for key elements"
  consistency_anchors:
    - "Nền giấy kem (#FDF6E3) xuyên suốt"
    - "Tiêu đề dùng màu đậm (#1A1A2E), highlight đỏ (#E94560) cho phép biến đổi quan trọng"
    - "Flat illustration, không 3D hay photorealism"

overlays:
  stat_card:
    bg: "#FFF8E7"
    border: "#E94560"
    radius: 6
    shadow: "0 2px 6px rgba(0,0,0,0.10)"
  key_term:
    bg: "#FFF0F0"
    text: "#E94560"
    radius: 4
  equation_box:
    bg: "#FFF8E7"
    border: "#F5A623"
    radius: 6

math_scene_defaults:
  math_intro:
    background: "#FDF6E3"
    title_color: "#1A1A2E"
    subtitle_color: "#7B7B8F"
  math_problem:
    background: "#FAF0D7"
    text_color: "#1A1A2E"
    border_accent: "#E94560"
  math_step:
    background: "#FFFFFF"
    equation_highlight: "#E94560"
    note_color: "#F5A623"
  math_answer:
    background: "#FFF0F0"
    answer_color: "#E94560"
  math_closing:
    background: "#FDF6E3"

quality_rules:
  - "Contrast ratio tối thiểu 4.5:1 cho mọi text"
  - "Nền giấy kem xuyên suốt — không dùng nền trắng thuần"
  - "Highlight chỉ dùng màu accent đỏ (#E94560) cho phép biến đổi quan trọng"
  - "Equation xuất hiện từng dòng, không hiện cùng lúc"
  - "Tối đa 3 màu trên màn hình cùng lúc (không tính nền)"
  - "Text đọc được ở 720p"
